<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat fixture</title>
</head>
<body>
<!-- A fake chat app: Enter appends your message and a "Thinking…" placeholder at once, then
     after ~800 ms fetches /chat/stream (SSE) and replaces the placeholder with the streamed
     reply, rendered as markdown. Caliper must time the reply, not the bubble or the placeholder.
     ?stream=nostore streams from /chat/stream-nostore instead. -->
<div id="messages"></div>
<input id="msg" size="60" placeholder="Message">
<script>
  const messages = document.getElementById("messages");
  const input = document.getElementById("msg");
  const stream = new URLSearchParams(location.search).get("stream") === "nostore" ? "/chat/stream-nostore" : "/chat/stream";
  const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Just enough markdown to re-render the bubble on every token: **bold** and paragraphs.
  const renderMarkdown = (md) =>
    md.split(/\n{2,}/).map((p) => `<p>${escapeHtml(p).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")}</p>`).join("");

  const bubble = (who, text) => {
    const div = document.createElement("div");
    div.className = `bubble ${who}`;
    div.textContent = text;
    messages.append(div);
    return div;
  };

  input.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" || !input.value.trim()) return;
    const prompt = input.value;
    input.value = "";
    bubble("user", prompt);
    const reply = bubble("assistant", "Thinking…");

    setTimeout(async () => {
      const res = await fetch(stream, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      let md = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const events = buffer.split("\n\n");
        buffer = events.pop();
        for (const event of events) {
          const data = event.replace(/^data: /, "");
          if (data === "[DONE]") continue;
          md += JSON.parse(data).t;
          reply.innerHTML = renderMarkdown(md);
        }
      }
    }, 800);
  });
</script>
</body>
</html>
