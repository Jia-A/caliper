<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ambiguous request fixture</title>
</head>
<body>
<!-- Pages where more than one request's bytes line up with the output changing.
     ?case=split       Generate opens two streams, POST /ambiguous/generate and
                       GET /ambiguous/status, and both write into #out, taking turns.
     ?case=tie         The same, with as many tokens on each stream.
     ?case=splitid     Like split, but the reply's path has a new random part per load:
                       POST /ambiguous/c/<random>/generate.
     ?case=late&id=<x> The first load of id x streams only POST /ambiguous/generate (6 tokens);
                       later loads also open GET /ambiguous/status, now with more tokens (7)
                       than the reply, so it would win the later runs on its own.
     ?case=typewriter  Generate opens POST /ambiguous/generate (a chunk every 400 ms) and
                       GET /ambiguous/heartbeat (a tick every 50 ms, never shown). The page
                       reveals the reply one letter every 30 ms, so most letters land just
                       after a heartbeat tick, not after a reply chunk. -->
<button id="generate">Generate</button>
<div id="out"></div>
<script>
  const which = new URLSearchParams(location.search).get("case");
  const LOAD = Number("__LOAD__"); // the server's count of this page's loads, per ?id
  const out = document.getElementById("out");

  // Calls onEvent with each SSE event's data until the stream ends.
  async function read(res, onEvent) {
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return;
      buffer += value;
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const event of events) onEvent(JSON.parse(event.replace(/^data: /, "")));
    }
  }

  document.getElementById("generate").addEventListener("click", () => {
    const path = which === "splitid" ? `/ambiguous/c/${Math.random().toString(36).slice(2, 10)}/generate` : "/ambiguous/generate";
    const generate = fetch(`${path}?case=${which}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: "{}",
    });
    if (["split", "splitid", "tie", "late"].includes(which)) {
      generate.then((res) => read(res, (d) => (out.textContent += d.t)));
      if (which === "late" && LOAD === 1) return;
      fetch(`/ambiguous/status?case=${which}`).then((res) => read(res, (d) => (out.textContent += d.t)));
      return;
    }
    fetch("/ambiguous/heartbeat").then((res) => read(res, () => {}));
    const queue = [];
    generate.then((res) => read(res, (d) => queue.push(...d.t)));
    const timer = setInterval(() => {
      if (queue.length) out.textContent += queue.shift();
    }, 30);
    setTimeout(() => clearInterval(timer), 5000);
  });
</script>
</body>
</html>
