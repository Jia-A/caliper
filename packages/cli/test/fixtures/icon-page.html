<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon send fixture</title>
</head>
<body>
<!-- A chat app whose send button is icon-only: an <svg> with no text, no aria-label and no
     title, so it has no accessible name and --measure can't find it. Enter in the input does
     NOT send. Clicking #UploadAndSendButton appends your message (if any) and a "Thinking…"
     placeholder at once, then after ~800 ms fetches /chat/stream (SSE) and streams the reply.
     #AttachButton is a second icon-only button (same class) that does nothing. -->
<div id="messages"></div>
<input id="msg" size="60" placeholder="Message">
<button type="button" class="icon" id="AttachButton"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 8h8M8 4v8" stroke="currentColor"/></svg></button>
<button type="button" class="icon" id="UploadAndSendButton"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8l12-6-4 12-2-5z" fill="currentColor"/></svg></button>
<script>
  const messages = document.getElementById("messages");
  const input = document.getElementById("msg");
  const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const renderMarkdown = (md) =>
    md.split(/\n{2,}/).map((p) => `<p>${escapeHtml(p).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")}</p>`).join("");

  const bubble = (who, text) => {
    const div = document.createElement("div");
    div.className = `bubble ${who}`;
    div.textContent = text;
    messages.append(div);
    return div;
  };

  // Enter is swallowed: only the icon button sends.
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") event.preventDefault();
  });

  document.getElementById("UploadAndSendButton").addEventListener("click", () => {
    const prompt = input.value;
    input.value = "";
    if (prompt.trim()) bubble("user", prompt);
    const reply = bubble("assistant", "Thinking…");

    setTimeout(async () => {
      const res = await fetch("/chat/stream", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      let md = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const events = buffer.split("\n\n");
        buffer = events.pop();
        for (const event of events) {
          const data = event.replace(/^data: /, "");
          if (data === "[DONE]") continue;
          md += JSON.parse(data).t;
          reply.innerHTML = renderMarkdown(md);
        }
      }
    }, 800);
  });
</script>
</body>
</html>
